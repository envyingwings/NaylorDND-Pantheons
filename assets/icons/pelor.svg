  <circle cx="100" cy="100" r="94" fill="url(#bg-pelor)" stroke="url(#ring-pelor)" stroke-width="5"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#f3e6c8" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#f3e6c8" stroke-opacity="0.2" stroke-width="1"/>
  <text x="100" y="118" text-anchor="middle" font-family="'Cinzel', 'Georgia', serif" font-size="58" font-weight="700" fill="#f6ecd6" stroke="#8a6d1a" stroke-width="1.5" paint-order="stroke">PE</text>
